name: 问题反馈 / Bug report
description: 报告可以复现的问题，请勿提交私人数据或密钥。
title: "[问题] "
labels: []
body:
  - type: markdown
    attributes:
      value: "感谢反馈！请先搜索是否已有相同问题。这里公开可见，请移除账号信息、私人内容和密钥。"
  - type: textarea
    id: goal
    attributes:
      label: 你原本想完成什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 发生了什么？如何复现？
      placeholder: 请按顺序描述操作、实际结果与期望结果。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 设备与浏览器
      placeholder: 例如 macOS + Chrome，或 iPhone + Safari
  - type: textarea
    id: extra
    attributes:
      label: 其他信息
      description: 如需附截图，请先遮盖个人内容和账号信息。
